services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: codecity-backend
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    restart: unless-stopped
    networks:
      - codecity-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: codecity-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - codecity-net

networks:
  codecity-net:
    driver: bridge
