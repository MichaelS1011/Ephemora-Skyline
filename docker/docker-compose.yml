services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: codecity-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3010}
      # nginx sits in front of the API here, so rate limits key on X-Forwarded-For
      - TRUST_PROXY=1
    restart: unless-stopped
    networks:
      - codecity-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: codecity-frontend
    ports:
      - "3010:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - codecity-net

networks:
  codecity-net:
    driver: bridge
