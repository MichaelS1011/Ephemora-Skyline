name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test (Node ${{ matrix.node }})
    # The node badge and `engines` state two floors — 20.19 and 22.12 — and the
    # machine this project is written on runs 24. Testing one version while
    # promising three is how a badge drifts away from the checks behind it, so
    # `claims-surface.test.ts` now reads this list and refuses a promise the
    # matrix does not keep.
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.12.0", "24"]
    runs-on: ubuntu-latest
    needs: build
    # The runner has Docker and no semgrep binary. Without this the adapter's
    # convenience fallback would pull an image from the registry inside a test
    # that waits 30 s — the badge would measure the network, not the code. The
    # scan then reports the engine as not run, which is what an absent engine
    # means on any other machine.
    env:
      SEMGREP_DOCKER: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: node scripts/audit-gate.mjs
