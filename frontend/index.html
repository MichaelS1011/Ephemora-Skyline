<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CodeCity CyberDefense — Interaktive 3D-City-Visualisierung deiner lokalen Projektordner als lebendige Cyberpunk-Stadt. Alles bleibt auf deiner Maschine."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1026'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='14' font-weight='bold' fill='%2300ff9f' text-anchor='middle'%3ECC%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>CodeCity CyberDefense</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #050510;
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Boot diagnostics — must register before any module loads.
      // Raw stack traces are only shown in development; in production the
      // overlay is skipped (errors still surface in the browser console).
      (function () {
        var isDev =
          location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isDev) return;
        function show(kind, msg) {
          var el = document.createElement('pre');
          el.id = 'boot-error';
          el.style.cssText = 'color:#ff6688;font:11px monospace;padding:12px;white-space:pre-wrap;position:relative;z-index:9999';
          el.textContent = kind + ': ' + msg;
          document.body.appendChild(el);
        }
        window.addEventListener('error', function (e) {
          var stack = e.error && e.error.stack ? '\n' + String(e.error.stack).slice(0, 1000) : '';
          show('BOOT ERROR', e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + stack);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('REJECTION', String((r && r.stack) || r).slice(0, 1000));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
