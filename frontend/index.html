<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CodeCity CyberDefense — Interaktive 3D-City-Visualisierung von GitHub-Repositories als lebendige Cyberpunk-Stadt"
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>CodeCity CyberDefense</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #050510;
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Boot diagnostics — must register before any module loads
      (function () {
        function show(kind, msg) {
          var el = document.createElement('pre');
          el.id = 'boot-error';
          el.style.cssText = 'color:#ff6688;font:11px monospace;padding:12px;white-space:pre-wrap;position:relative;z-index:9999';
          el.textContent = kind + ': ' + msg;
          document.body.appendChild(el);
        }
        window.addEventListener('error', function (e) {
          var stack = e.error && e.error.stack ? '\n' + String(e.error.stack).slice(0, 1000) : '';
          show('BOOT ERROR', e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + stack);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('REJECTION', String((r && r.stack) || r).slice(0, 1000));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
