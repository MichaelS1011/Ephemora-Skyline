<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ephemora Skyline — your codebase as a living cyberpunk city. Security, complexity and git history made visible. Everything stays on your machine."
    />
    <link rel="icon" type="image/svg+xml" href="/ephemora.svg" />
    <title>Ephemora Skyline</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #161614;
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Boot diagnostics — must register before any module loads.
      // Raw stack traces are only shown in development; in production the
      // overlay is skipped (errors still surface in the browser console).
      (function () {
        var isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        if (!isDev) return;
        function show(kind, msg) {
          var el = document.createElement("pre");
          el.id = "boot-error";
          el.style.cssText =
            "color:#ff6688;font:11px monospace;padding:12px;white-space:pre-wrap;position:relative;z-index:9999";
          el.textContent = kind + ": " + msg;
          document.body.appendChild(el);
        }
        window.addEventListener("error", function (e) {
          var stack = e.error && e.error.stack ? "\n" + String(e.error.stack).slice(0, 1000) : "";
          show(
            "BOOT ERROR",
            e.message + "\n" + (e.filename || "") + ":" + (e.lineno || "") + stack,
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show("REJECTION", String((r && r.stack) || r).slice(0, 1000));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
