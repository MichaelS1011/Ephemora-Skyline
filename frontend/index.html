<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ephemora Skyline — walk your codebase as a 3D city: files are towers, security findings burn on the roof. Local only: no upload, no account, no telemetry."
    />
    <meta name="theme-color" content="#161614" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ephemora Skyline — your codebase as a 3D city" />
    <meta
      property="og:description"
      content="Folders are districts, files are towers, and every finding a scanner made burns on a roof. Runs on your machine; your source never leaves it."
    />
    <meta property="og:image" content="/og-hero.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ephemora Skyline — your codebase as a 3D city" />
    <meta
      name="twitter:description"
      content="Walk your codebase as a 3D city. Security findings burn on the roof of the file they sit in. Local only, no upload, no telemetry."
    />
    <link rel="icon" type="image/svg+xml" href="/ephemora.svg" />
    <title>Ephemora Skyline</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #161614;
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--EPHEMORA-EMBED-->
    <script>
      // Boot diagnostics — must register before any module loads.
      // Raw stack traces are only shown in development; in production the
      // overlay is skipped (errors still surface in the browser console).
      (function () {
        var isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        if (!isDev) return;
        function show(kind, msg) {
          var el = document.createElement("pre");
          el.id = "boot-error";
          el.style.cssText =
            "color:#ff6688;font:11px monospace;padding:12px;white-space:pre-wrap;position:relative;z-index:9999";
          el.textContent = kind + ": " + msg;
          document.body.appendChild(el);
        }
        window.addEventListener("error", function (e) {
          var stack = e.error && e.error.stack ? "\n" + String(e.error.stack).slice(0, 1000) : "";
          show(
            "BOOT ERROR",
            e.message + "\n" + (e.filename || "") + ":" + (e.lineno || "") + stack,
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show("REJECTION", String((r && r.stack) || r).slice(0, 1000));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
